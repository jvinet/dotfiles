unbind C-b
set -g prefix C-a

bind C-a last-window
bind a send-prefix

set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style 'bg=#2b303b,fg=#d9d8d8,bold'

# Approximate Waybar's workspace styling with tmux windows.
set -g status-left-length 30
set -g status-left '#[fg=#009ddc] #S #[fg=#d9d8d8]'
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#65676a] #I:#W '
setw -g window-status-current-format '#[fg=#009ddc] #I:#W '
setw -g window-status-activity-style 'fg=#ee2e24'
setw -g window-status-bell-style 'fg=#ee2e24'
setw -g window-status-current-style bg=#0D47A1

# Borders.
set -g pane-active-border-style "fg=#1565C0,bold"
set -g pane-border-lines "heavy"
set -g pane-border-indicators arrows

# Resolve the helper relative to this config, so the pair can be installed in
# any directory (for example, ~/.config/tmux/).
set -gF @waybar-status-script '/home/jvinet/.tmux/tmux-status.sh'
set -g @waybar-status-theme 'colour'
set -g status-right-length 100
set -g status-right '#("#{@waybar-status-script}" "#{@waybar-status-theme}")'

# Prefix + Ctrl-t toggles the theme for the active session only.
bind-key C-t if-shell -F '#{==:#{@waybar-status-theme},colour}' \
    'set-option @waybar-status-theme monochrome; refresh-client -S' \
    'set-option @waybar-status-theme colour; refresh-client -S'

# Show a ^ beside windows that have activity monitoring enabled
set-window-option -g window-status-current-format "#[bg=default]#[fg=white]#[bold]#I:#W#[default]#[fg=white]#[bg=yellow]#{?monitor-activity,^,}"
set-window-option -g window-status-format "#I:#W#{?monitor-activity,^,}"
# Toggle window monitoring
bind m run "tmux show-window-option monitor-activity | grep -Eq 'on$' && tmux setw monitor-activity off || tmux setw monitor-activity on"
# Show a message when a monitored window sees activity
set-hook -g alert-activity 'display-message "Activity in window #{window_name}"'

# The default is 500ms, which makes mode-switching in Vim very slow.
set -sg escape-time 0

# Allow apps to use smcup/rmcup terminal capabilities so the screen content
# is preserved before/after an app runs.
#set-window-option -g alternate-screen off

set-option -g set-clipboard on
set -g mouse on

# Use accurate colours and italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Advertise modern underline styles
set -as terminal-features ",xterm-256color:usstyle"
set -as terminal-features ",tmux-256color:usstyle"
# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
set -g extended-keys on

# Vim-like movements
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Swap window to left or right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Make new window/pane commands inherit the CWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Sometimes I lapse into my i3 shortcuts
bind _ split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Break/Join panes
bind + break-pane
bind / command-prompt -p "send pane to:" "join-pane -t '%%'"

# Toggle broadcast mode, where input is sent to all panes at once
bind b set-window-option synchronize-panes

# For Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# h/t https://rushter.com/blog/helix-editor/
bind y popup -w 95% -h 95% -d '#{pane_current_path}' -E 'tmux new-session yazi \; set status off'
bind g popup -w 95% -h 95% -d '#{pane_current_path}' -E lazygit
bind e popup -w 95% -h 95% -E "tmux capture-pane -Jp -S- | nvim -"

# Set terminal titles to something useful
set -g set-titles on
set -g set-titles-string "#I:#W - #T"

# Causes tmux to resize a window based on the smallest client actually
# viewing it, not on the smallest one attached to the entire session.
setw -g aggressive-resize on

# List of plugins
#   Supports `github_username/repo` or full git URLs
#   Hit `<prefix> + I` to install plugins within tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'https://github.com/laktak/extrakto'
# Other examples:
# github_username/plugin_name    \
# git@github.com/user/plugin     \
# git@bitbucket.com/user/plugin  \

# initializes TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Re-bind this, it gets lost.
bind J resize-pane -D 5

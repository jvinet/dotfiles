unbind C-b
set -g prefix C-a

bind C-a last-window
bind a send-prefix

set -g status on
set -g status-position bottom
set -g status-interval 4
set -g status-justify left
set -g status-style 'bg=#2b303b,fg=#d9d8d8,bold'

set -g status-left-length 30
set -g status-left '#[fg=#009ddc] #S #[fg=#d9d8d8]'
setw -g window-status-separator ' '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#888888'
setw -g window-status-current-style 'fg=#009ddc,bg=#0d47a1'

setw -g window-status-activity-style 'fg=#ee2e24'
setw -g window-status-bell-style 'fg=#ee2e24'
setw -g window-status-current-style bg=#0d47a1

# Borders.
set -g pane-active-border-style "fg=#1565C0,bold"
set -g pane-border-lines "heavy"
set -g pane-border-indicators arrows

# Resolve the helper relative to this config, so the pair can be installed in
# any directory (for example, ~/.config/tmux/).
set -gF @status-script '/home/jvinet/.tmux/tmux-status.sh'
set -g @status-theme 'colour'
set -g status-right-length 100
set -g status-right '#("#{@status-script}" "#{@status-theme}")'

# ^t: toggles the theme for the active session only.
bind-key C-t if-shell -F '#{==:#{@status-theme},colour}' \
    'set-option @status-theme monochrome; refresh-client -S' \
    'set-option @status-theme colour; refresh-client -S'

# m: choose a persistent foreground colour for this window.
bind-key m display-menu -T "Window colour" -x C -y C \
    "#[fg=red]Red"        r "set-option -w window-status-style 'fg=red'     ; set-option -w window-status-current-style 'fg=red,bg=#0d47a1'" \
    "#[fg=yellow]Yellow"  y "set-option -w window-status-style 'fg=yellow'  ; set-option -w window-status-current-style 'fg=yellow,bg=#0d47a1'" \
    "#[fg=green]Green"    g "set-option -w window-status-style 'fg=green'   ; set-option -w window-status-current-style 'fg=green,bg=#0d47a1'" \
    "#[fg=#269bff]Blue"   b "set-option -w window-status-style 'fg=#269bff' ; set-option -w window-status-current-style 'fg=#269bff,bg=#0d47a1'" \
    "#[fg=#00d6ef]Cyan"   c "set-option -w window-status-style 'fg=#00d6ef' ; set-option -w window-status-current-style 'fg=#00d6ef,bg=#0d47a1'" \
    "#[fg=#c07de6]Purple" p "set-option -w window-status-style 'fg=#c07de6' ; set-option -w window-status-current-style 'fg=#c07de6,bg=#0d47a1'"
# M: remove the custom colour.
bind-key M \
    set-option -wu window-status-style \; \
    set-option -wu window-status-current-style

# Show a ^ beside windows that have activity monitoring enabled
setw -g window-status-current-format "#[bg=default]#[fg=white]#[bold]#I:#W#[default]#[fg=white]#[bg=yellow]#{?monitor-activity,^,}"
setw -g window-status-format "#I:#W#{?monitor-activity,^,}"
# Toggle window monitoring
bind ^ run "tmux show-window-option monitor-activity | grep -Eq 'on$' && tmux setw monitor-activity off || tmux setw monitor-activity on"
# Show a message when a monitored window sees activity
set-hook -g alert-activity 'display-message "Activity in window #{window_name}"'

# N: open a floating pane within the current pane, intended to add a note
bind-key N run-shell '
    w=#{pane_width}
    h=#{pane_height}
    x=#{pane_left}
    y=#{pane_top}

    fw=$((w * 80 / 100))
    fh=$((h * 50 / 100))

    # Centre horizontally inside the active pane.
    fx=$((x + (w - fw) / 2))

    # "Post-it note" position: a few rows below the top.
    fy=$((y + 3))

    tmux new-pane \
        -x "$fw" \
        -y "$fh" \
        -X "$fx" \
        -Y "$fy" \
        -c "#{pane_current_path}" \
        nvim
'

# The default is 500ms, which makes mode-switching in Vim very slow.
set -sg escape-time 0

# Allow apps to use smcup/rmcup terminal capabilities so the screen content
# is preserved before/after an app runs.
#setw -g alternate-screen off

set-option -g set-clipboard on
set -g mouse on

# Use accurate colours and italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Advertise modern underline styles
set -as terminal-features ",xterm-256color:usstyle"
set -as terminal-features ",tmux-256color:usstyle"
# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
set -g extended-keys on

# Vim-like movements
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Swap window to left or right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Make new window/pane commands inherit the CWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Sometimes I lapse into my i3 shortcuts
bind _ split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Break/Join panes
bind + break-pane
bind / command-prompt -p "send pane to:" "join-pane -t '%%'"

# Toggle broadcast mode, where input is sent to all panes at once
bind b setw synchronize-panes

# For Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# h/t https://rushter.com/blog/helix-editor/
bind y popup -w 95% -h 95% -d '#{pane_current_path}' -E 'tmux new-session yazi \; set status off'
bind g popup -w 95% -h 95% -d '#{pane_current_path}' -E lazygit
bind e popup -w 95% -h 95% -E "tmux capture-pane -Jp -S- | nvim -"

# Set terminal titles to something useful
set -g set-titles on
set -g set-titles-string "#I:#W - #T"

# Causes tmux to resize a window based on the smallest client actually
# viewing it, not on the smallest one attached to the entire session.
setw -g aggressive-resize on

# List of plugins
#   Supports `github_username/repo` or full git URLs
#   Hit `<prefix> + I` to install plugins within tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'https://github.com/laktak/extrakto'
# Other examples:
# github_username/plugin_name    \
# git@github.com/user/plugin     \
# git@bitbucket.com/user/plugin  \

# initializes TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Re-bind this, it gets lost.
bind J resize-pane -D 5

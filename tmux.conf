unbind C-b
set -g prefix C-a

bind C-a last-window
bind a send-prefix

# If tmux can't infer UTF8 capability, you might need to start it with -u
#set -g utf8 on

# Fancier status bar (needs 256-colour terminal support)
set -g status on
set -g status-bg colour235
set -g status-fg white
set -g status-left '#[fg=cyan]#H '
#set -g status-right '#[fg=colour246]#(cat /proc/loadavg | cut -d" " -f1-3 | sed "s/ /, /g") #[fg=yellow]#(cat /sys/class/power_supply/BAT0/capacity)% #[fg=green]#(date "+%b %d %H:%M")'
set -g status-right '#[fg=colour246]#(cat /proc/loadavg | cut -d" " -f1-3 | sed "s/ /, /g")  '
set -g status-left-length 20
set -g status-right-length 40

# Show a ^ beside windows that have activity monitoring enabled
set-window-option -g window-status-current-format "#[bg=default]#[fg=white]#[bold]#I:#W#[default]#[fg=white]#[bg=yellow]#{?monitor-activity,^,}"
set-window-option -g window-status-format "#I:#W#{?monitor-activity,^,}"

# Highlight active window
set-window-option -g window-status-current-style bg=colour88

# The default is 500ms, which makes mode-switching in Vim very slow.
set -sg escape-time 0

# Allow apps to use smcup/rmcup terminal capabilities so the screen content
# is preserved before/after an app runs.
#set-window-option -g alternate-screen off

set-option -g set-clipboard on

# Use accurate colours and italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Advertise modern underline styles
set -as terminal-features ",xterm-256color:usstyle"
set -as terminal-features ",tmux-256color:usstyle"

# Just click it
set -g mouse on

# Vim-like movements
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Make new window/pane commands inherit the CWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Sometimes I lapse into my i3 shortcuts
bind _ split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Break/Join panes
bind + break-pane
bind / command-prompt -p "send pane to:" "join-pane -t '%%'"

# Toggle broadcast mode, where input is sent to all panes at once
bind b set-window-option synchronize-panes

# Copying
# bind [ copy-mode
# unbind -T copy-mode-vi Enter
# bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "exec wl-copy"
# bind -T copy-mode-vi Escape send-keys -X cancel

# Copy a tmux buffer into the clipboard
#bind v save-buffer ~/.tmux-buffer \; run-shell "wl-copy <~/.tmux-buffer && rm -f ~/.tmux-buffer"

# For Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# h/t https://rushter.com/blog/helix-editor/
bind y popup -w 95% -h 95% -d '#{pane_current_path}' -E 'tmux new-session yazi \; set status off'
bind g popup -w 95% -h 95% -d '#{pane_current_path}' -E lazygit
bind e popup -w 95% -h 95% -E "tmux capture-pane -Jp -S- | nvim -"

# Set terminal titles to something useful
set -g set-titles on
set -g set-titles-string "#I:#W - #T"

# Causes tmux to resize a window based on the smallest client actually
# viewing it, not on the smallest one attached to the entire session.
setw -g aggressive-resize on

# Toggle window monitoring
bind m run "tmux show-window-option monitor-activity | grep -Eq 'on$' && tmux setw monitor-activity off || tmux setw monitor-activity on"
# Show an OS toast when a monitored window sees activity
set-hook -g alert-activity 'run-shell "notify-send \"tmux\" \"Activity in window #{window_name}\""'

# List of plugins
#   Supports `github_username/repo` or full git URLs
#   Hit `<prefix> + I` to install plugins within tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'https://github.com/laktak/extrakto'

# Other examples:
# github_username/plugin_name    \
# git@github.com/user/plugin     \
# git@bitbucket.com/user/plugin  \

# initializes TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Re-bind this, it gets lost.
bind J resize-pane -D 5
